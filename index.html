<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agenda Anual IEADESGA</title>
<style>
:root{--blue:#0b4f6c;--green:#47734b;--gold:#c7a34b;--bg:#f5f7f6;--text:#1f2933;--muted:#6b7280;--white:#fff;--border:#e5e7eb;--setor:#0d9488;--campo:#dc2626}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text)}
.app{display:flex;min-height:100vh}.sidebar{width:245px;background:linear-gradient(180deg,#073b50,#0b4f6c);color:#fff;padding:22px 16px;display:flex;flex-direction:column}
.brand img{max-width:210px;max-height:120px;object-fit:contain;background:transparent;border-radius:0;padding:0}
.nav{margin-top:25px}.nav button{width:100%;border:0;background:transparent;color:#e8f1f3;text-align:left;padding:12px;border-radius:9px;cursor:pointer;font-size:14px;margin-bottom:4px}.nav button.active,.nav button:hover{background:rgba(255,255,255,.13)}
.legend{margin-top:auto;padding-top:18px;border-top:1px solid rgba(255,255,255,.18)}.legend h4{font-size:12px;margin:0 0 10px;color:#dbe9ed}.legend-item{font-size:11px;margin:8px 0;display:flex;align-items:center;gap:8px}.dot{width:10px;height:10px;border-radius:50%}
.main{flex:1;padding:24px;overflow:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:20px}.title h1{font-size:25px;margin:0 0 4px}.title p{margin:0;color:var(--muted);font-size:13px}.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
button,.select,input,textarea{font:inherit}.btn{border:1px solid var(--border);background:#fff;border-radius:8px;padding:9px 13px;cursor:pointer}.btn.primary{background:var(--green);color:#fff;border-color:var(--green)}.btn.danger{background:#fff;color:#b42318;border-color:#f1c5c1}.btn:hover{filter:brightness(.98)}
.toolbar{background:#fff;border:1px solid var(--border);border-radius:12px;padding:12px;display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:14px}.toolbar .spacer{flex:1}.select,input{border:1px solid var(--border);border-radius:8px;padding:9px;background:#fff;color:var(--text)}input[type="search"]{min-width:220px}
.calendar-card{background:#fff;border:1px solid var(--border);border-radius:14px;overflow:hidden}.calendar-head{display:flex;justify-content:space-between;align-items:center;padding:15px 18px;border-bottom:1px solid var(--border)}.calendar-head h2{margin:0;font-size:17px}.week{display:grid;grid-template-columns:60px repeat(7,1fr);border-bottom:1px solid var(--border)}.week div{padding:9px;text-align:center;font-size:11px;color:var(--muted);border-right:1px solid var(--border)}.week .today{color:var(--green);font-weight:700}.grid{display:grid;grid-template-columns:60px repeat(7,1fr);min-width:760px}.time{height:62px;border-right:1px solid var(--border);border-bottom:1px solid var(--border);font-size:10px;color:#9ca3af;text-align:right;padding:6px}.cell{height:62px;border-right:1px solid var(--border);border-bottom:1px solid var(--border);position:relative;padding:3px;cursor:pointer}.cell:hover{background:#fafdfb}.event{position:absolute;left:4px;right:4px;top:4px;background:#e5f1e7;border-left:4px solid var(--green);border-radius:6px;padding:5px;font-size:11px;overflow:hidden;cursor:pointer;z-index:2}.event.blue{background:#e5f0f6;border-left-color:var(--blue)}.event.gold{background:#fbf4df;border-left-color:var(--gold)}.event.red{background:#fbe9e7;border-left-color:#c54b42}.event strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.event small{color:#556;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scope{display:inline-block;font-size:9px;font-weight:700;letter-spacing:.4px;padding:2px 7px;border-radius:99px;background:var(--setor);color:#fff;margin-left:6px;vertical-align:middle}.scope.campo{background:var(--campo)}.event.s-setor{border-right:5px solid var(--setor)}.event.s-campo{border-right:5px solid var(--campo)}.month-event.s-setor{border-right:4px solid var(--setor)}.month-event.s-campo{border-right:4px solid var(--campo)}
.month-grid{display:grid;grid-template-columns:repeat(7,1fr)}.month-head{background:#fafafa;border-bottom:1px solid var(--border)}.month-head div{padding:10px;text-align:center;font-size:11px;font-weight:700;color:var(--muted);border-right:1px solid var(--border)}.month-body{min-width:760px}.month-cell{min-height:118px;border-right:1px solid var(--border);border-bottom:1px solid var(--border);padding:7px;cursor:pointer;background:#fff}.month-cell:hover{background:#fafdfb}.month-cell.outside{background:#f8faf9}.day-number{font-size:12px;font-weight:600;margin-bottom:5px;color:#4b5563}.outside .day-number{color:#b6bdc4}.month-today .day-number{display:inline-flex;background:var(--green);color:#fff;width:24px;height:24px;border-radius:50%;align-items:center;justify-content:center}.month-events{display:flex;flex-direction:column;gap:3px}.month-event{font-size:10px;line-height:1.3;padding:4px 5px;border-radius:5px;background:#e5f1e7;border-left:3px solid var(--green);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.month-event.blue{background:#e5f0f6;border-left-color:var(--blue)}.month-event.gold{background:#fbf4df;border-left-color:var(--gold)}.month-event.red{background:#fbe9e7;border-left-color:#c54b42}.more-events{font-size:10px;color:var(--green);font-weight:700;padding:2px 4px}
.list-view{display:none;background:#fff;border:1px solid var(--border);border-radius:14px;padding:16px}.list-item{display:flex;justify-content:space-between;gap:12px;padding:13px;border-bottom:1px solid var(--border)}.list-item:last-child{border-bottom:0}.list-main strong{display:block}.list-main span{font-size:12px;color:var(--muted)}
.modal-backdrop{display:none;position:fixed;inset:0;background:rgba(15,23,42,.48);align-items:center;justify-content:center;padding:18px;z-index:20}.modal{width:min(620px,100%);background:#fff;border-radius:15px;box-shadow:0 20px 60px rgba(0,0,0,.25);overflow:hidden}.modal-head{padding:17px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between}.modal-head h3{margin:0}.modal-body{padding:20px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:12px;font-weight:600;color:#4b5563}.field textarea{min-height:80px;resize:vertical;border:1px solid var(--border);border-radius:8px;padding:9px}.modal-foot{padding:14px 20px;border-top:1px solid var(--border);display:flex;justify-content:space-between}.right-actions{display:flex;gap:8px}
.toast{position:fixed;right:20px;bottom:20px;background:#173b2b;color:#fff;padding:12px 16px;border-radius:9px;display:none;z-index:30;font-size:13px}
@media(max-width:900px){.sidebar{width:190px}.main{padding:15px}.top{align-items:flex-start;flex-direction:column}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}}
@media(max-width:650px){.sidebar{display:none}.main{padding:10px}.toolbar input[type=search]{min-width:100%;order:10}.week,.grid{min-width:720px}}
#printArea{display:none}
@media print{
 body{background:#fff}
 .app,.modal-backdrop,.toast{display:none!important}
 #printArea{display:block}
 .p-head{border-bottom:2px solid #0b4f6c;padding-bottom:10px;margin-bottom:16px}
 .p-head h1{margin:0;font-size:19px;color:#0b4f6c}
 .p-head p{margin:4px 0 0;font-size:11px;color:#555}
 .p-day{margin-bottom:14px;break-inside:avoid;page-break-inside:avoid}
 .p-day h2{font-size:13px;margin:0 0 4px;background:#f0f4f3;padding:6px 8px;border-radius:4px}
 .p-ev{display:flex;gap:10px;padding:5px 8px;border-bottom:1px solid #e5e7eb;font-size:12px}
 .p-time{font-weight:700;min-width:50px}
 .p-meta{color:#555;font-size:10px}
 @page{margin:15mm}
}
 .sidebar{background:#fff;color:#1f2933;border-right:1px solid #e2e8e6}
.brand{border-bottom-color:#e2e8e6}
.brand h3{color:#0b4f6c}
.brand p{color:#6b7280}
.nav button{color:#3c4a52}
.nav button.active,.nav button:hover{background:#e9f0ee;color:#0b4f6c}
.legend{border-top-color:#e2e8e6}
.legend h4{color:#6b7280}
</style>
</head>

    <select id="categoryFilter" class="select" onchange="render()"><option value="">Todas as categorias</option><option>Culto / Evento</option><option>Reunião</option><option>Departamento</option><option>Data importante</option></select><select id="scopeFilter" class="select" onchange="render()"><option value="">Setor e Campo</option><option>Setor</option><option>Campo</option></select>
    <select id="locationFilter" class="select" onchange="render()"><option value="">Todas as congregações</option></select>
    <input id="search" type="search" placeholder="🔍 Buscar evento..." oninput="render()"><button class="btn" onclick="printPDF()">⬇ Baixar PDF</button>
  </div>
  <section id="calendar" class="calendar-card"></section>
  <section id="list" class="list-view"></section>
</main>
</div>

<div id="printArea"></div><div id="modalBackdrop" class="modal-backdrop">
<div class="modal">
  <div class="modal-head"><h3 id="modalTitle">Novo evento</h3><button class="btn" onclick="closeModal()">✕</button></div>
  <form id="eventForm">
  <div class="modal-body">
    <div class="form-grid">
      <div class="field full"><label>Título *</label><input id="fTitle" required placeholder="Ex.: Culto de Santa Ceia"></div>
      <div class="field"><label>Data *</label><input id="fDate" type="date" required></div>
      <div class="field"><label>Horário *</label><input id="fTime" type="time" required></div>
      <div class="field"><label>Categoria</label><select id="fCategory"><option>Culto / Evento</option><option>Reunião</option><option>Departamento</option><option>Data importante</option></select></div>
      <div class="field"><label>Âmbito</label><select id="fScope"><option>Setor</option><option>Campo</option></select></div><div class="field"><label>Congregação / Local</label><input id="fLocation" placeholder="Ex.: Monte Hermom"></div>
      <div class="field"><label>Responsável</label><input id="fResponsible" placeholder="Nome do responsável"></div>
      <div class="field"><label>Recorrência</label><select id="fRepeat"><option value="">Não repetir</option><option value="weekly">Toda semana</option><option value="monthly">Todo mês</option></select></div>
      <div class="field full"><label>Descrição / Observações</label><textarea id="fDescription" placeholder="Informações adicionais..."></textarea></div>
    </div>
  </div>
  <div class="modal-foot"><button type="button" id="deleteBtn" class="btn danger" onclick="deleteEvent()" style="display:none">Excluir</button><div class="right-actions"><button type="button" class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary" type="submit">Salvar evento</button></div></div>
  </form>
</div>
</div>
<div id="toast" class="toast"></div>

<script>
const KEY='ieadesga_setor4_agenda_v1';
let events=JSON.parse(localStorage.getItem(KEY)||'[]');
let editingId=null, currentDate=new Date();
const colors={'Culto / Evento':'','Reunião':'blue','Departamento':'gold','Data importante':'red'};
const pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const fmt=d=>d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric'});
function save(){localStorage.setItem(KEY,JSON.stringify(events))}
function toast(t){let e=document.getElementById('toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',2200)}
function startOfWeek(d){let x=new Date(d);let day=x.getDay();x.setDate(x.getDate()-(day===0?6:day-1));x.setHours(0,0,0,0);return x}
function moveWeek(n){currentDate.setDate(currentDate.getDate()+n*7);render()}
function goToday(){currentDate=new Date();render()}
function setView(v,btn){document.getElementById('viewSelect').value=v;document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));if(btn)btn.classList.add('active');document.getElementById('calendar').style.display=v==='list'?'none':'block';document.getElementById('list').style.display=v==='list'?'block':'none';render()}
function openModal(id=null,date=null){editingId=id;document.getElementById('eventForm').reset();document.getElementById('modalTitle').textContent=id?'Editar evento':'Novo evento';document.getElementById('deleteBtn').style.display=id?'inline-block':'none';let e=events.find(x=>x.id===id);if(e){fTitle.value=e.title;fDate.value=e.date;fTime.value=e.time;fCategory.value=e.category;fScope.value=e.scope||'Setor';fLocation.value=e.location||'';fResponsible.value=e.responsible||'';fRepeat.value=e.repeat||'';fDescription.value=e.description||''}else{fDate.value=date||iso(currentDate);fTime.value='19:00'}document.getElementById('modalBackdrop').style.display='flex'}
function closeModal(){document.getElementById('modalBackdrop').style.display='none';editingId=null}
document.getElementById('eventForm').addEventListener('submit',e=>{e.preventDefault();let data={id:editingId||Date.now().toString(),title:fTitle.value.trim(),date:fDate.value,time:fTime.value,category:fCategory.value,scope:fScope.value,location:fLocation.value.trim(),responsible:fResponsible.value.trim(),repeat:fRepeat.value,description:fDescription.value.trim()};if(editingId){events=events.map(x=>x.id===editingId?data:x)}else{events.push(data);if(data.repeat){let base=new Date(data.date+'T12:00');for(let i=1;i<=5;i++){let d=new Date(base);if(data.repeat==='weekly')d.setDate(d.getDate()+i*7);else d.setMonth(d.getMonth()+i);events.push({...data,id:(Date.now()+i).toString(),date:iso(d)})}}}save();closeModal();render();toast(editingId?'Evento atualizado!':'Evento criado!')})
function deleteEvent(){if(!editingId)return;if(confirm('Excluir este evento?')){events=events.filter(x=>x.id!==editingId);save();closeModal();render();toast('Evento excluído!')}}
function filtered(){let cat=document.getElementById('categoryFilter').value,loc=document.getElementById('locationFilter').value,scope=document.getElementById('scopeFilter').value,q=document.getElementById('search').value.toLowerCase();return events.filter(e=>(!cat||e.category===cat)&&(!loc||e.location===loc)&&(!scope||(e.scope||'Setor')===scope)&&(!q||[e.title,e.location,e.responsible,e.description,e.scope].join(' ').toLowerCase().includes(q))).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time))}
function updateLocations(){let s=document.getElementById('locationFilter'),old=s.value;let loc=[...new Set(events.map(e=>e.location).filter(Boolean))].sort();s.innerHTML='<option value="">Todas as congregações</option>'+loc.map(x=>`<option>${escapeHtml(x)}</option>`).join('');s.value=loc.includes(old)?old:''}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function render(){updateLocations();let view=document.getElementById('viewSelect').value;if(view==='list'){renderList();return}if(view==='month'){renderMonth();return}renderWeek()}
function renderMonth(){
  let cal=document.getElementById('calendar');
  let y=currentDate.getFullYear(), m=currentDate.getMonth();
  let first=new Date(y,m,1), last=new Date(y,m+1,0);
  let start=new Date(first); start.setDate(first.getDate()-(first.getDay()===0?6:first.getDay()-1));
  let end=new Date(last); end.setDate(last.getDate()+(7-(last.getDay()===0?7:last.getDay())));
  let days=[]; for(let d=new Date(start); d<=end; d.setDate(d.getDate()+1)) days.push(new Date(d));
  let monthName=currentDate.toLocaleDateString('pt-BR',{month:'long',year:'numeric'});
  let html=`<div class="calendar-head"><h2>${monthName.charAt(0).toUpperCase()+monthName.slice(1)}</h2><span style="font-size:12px;color:#6b7280">Clique em um dia para criar um evento</span></div>`;
  html+=`<div class="month-grid month-head">${['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'].map(x=>`<div>${x}</div>`).join('')}</div>`;
  html+=`<div class="month-grid month-body">`;
  for(const d of days){
    let date=iso(d), outside=d.getMonth()!==m, today=date===iso(new Date());
    let ev=filtered().filter(e=>e.date===date);
    html+=`<div class="month-cell ${outside?'outside':''} ${today?'month-today':''}" onclick="openModal(null,'${date}')">
      <div class="day-number">${d.getDate()}</div>
      <div class="month-events">${ev.slice(0,4).map(e=>`<div class="month-event ${colors[e.category]} ${(e.scope||'Setor')==='Campo'?'s-campo':'s-setor'}" onclick="event.stopPropagation();openModal('${e.id}')"><b>${escapeHtml(e.time)}</b>${escapeHtml(e.title)}</div>`).join('')}
      ${ev.length>4?`<div class="more-events">+${ev.length-4} mais</div>`:''}</div>
    </div>`;
  }
  html+='</div>';
  cal.innerHTML=html;
}
function renderWeek(){let cal=document.getElementById('calendar'),start=startOfWeek(currentDate),days=[];for(let i=0;i<7;i++){let d=new Date(start);d.setDate(start.getDate()+i);days.push(d)}let title=`${days[0].toLocaleDateString('pt-BR',{day:'2-digit',month:'long'})} – ${days[6].toLocaleDateString('pt-BR',{day:'2-digit',month:'long',year:'numeric'})}`;let html=`<div class="calendar-head"><h2>${title}</h2><span style="font-size:12px;color:#6b7280">Clique em um horário para criar um evento</span></div><div class="week"><div></div>${days.map(d=>`<div class="${iso(d)===iso(new Date())?'today':''}">${d.toLocaleDateString('pt-BR',{weekday:'short'}).replace('.','')}<br><b>${d.getDate()}</b></div>`).join('')}</div><div class="grid">`;for(let h=7;h<=22;h++){html+=`<div class="time">${pad(h)}:00</div>`;for(let i=0;i<7;i++){let date=iso(days[i]);let ev=filtered().filter(e=>e.date===date&&parseInt(e.time.split(':')[0])===h);html+=`<div class="cell" onclick="openModal(null,'${date}')">${ev.map(e=>`<div class="event ${colors[e.category]} ${(e.scope||'Setor')==='Campo'?'s-campo':'s-setor'}" onclick="event.stopPropagation();openModal('${e.id}')"><strong>${escapeHtml(e.title)}</strong><small>${e.time} · ${escapeHtml(e.scope||'Setor')}${e.location?' · '+escapeHtml(e.location):''}</small></div>`).join('')}</div>`}}html+='</div>';cal.innerHTML=html}
function renderList(){let list=document.getElementById('list'),arr=filtered();if(!arr.length){list.innerHTML='<p style="color:#6b7280;text-align:center;padding:30px">Nenhum evento encontrado.</p>';return}list.innerHTML='<h2 style="font-size:17px;margin:0 0 10px">Próximos eventos</h2>'+arr.map(e=>`<div class="list-item"><div class="list-main"><strong>${escapeHtml(e.title)}<span class="scope ${(e.scope||'Setor')==='Campo'?'campo':''}">${escapeHtml(e.scope||'Setor')}</span></strong><span>${fmt(new Date(e.date+'T12:00'))} às ${e.time} · ${escapeHtml(e.location||'Sem local')} · ${escapeHtml(e.category)}</span>${e.responsible?`<span> · Responsável: ${escapeHtml(e.responsible)}</span>`:''}</div><button class="btn" onclick="openModal('${e.id}')">Editar</button></div>`).join('')}
render();
function imprimirPDF(){
 const arr=filtered();
 if(!arr.length){toast('Nenhum evento para exportar.');return}
 const cat=document.getElementById('categoryFilter').value,loc=document.getElementById('locationFilter').value,scope=document.getElementById('scopeFilter').value,q=document.getElementById('search').value.trim();
 const f=[cat,scope,loc,q?'"'+q+'"':''].filter(Boolean).join(' · ');
 const grupos={};
 arr.forEach(e=>{(grupos[e.date]=grupos[e.date]||[]).push(e)});
 let html='<div class="p-head"><h1>Agenda do Setor 4 · IEADESGA</h1><p>'+arr.length+' evento(s)'+(f?' · Filtros: '+escapeHtml(f):'')+' · Gerado em '+new Date().toLocaleDateString('pt-BR')+'</p></div>';
 Object.keys(grupos).sort().forEach(dia=>{
  const d=new Date(dia+'T12:00');
  const nome=d.toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long',year:'numeric'});
  html+='<div class="p-day"><h2>'+nome.charAt(0).toUpperCase()+nome.slice(1)+'</h2>';
  grupos[dia].forEach(e=>{
   const meta=[e.scope||'Setor',e.category,e.location,e.responsible?'Resp.: '+e.responsible:''].filter(Boolean).map(escapeHtml).join(' · ');
   html+='<div class="p-ev"><span class="p-time">'+escapeHtml(e.time)+'</span><span><b>'+escapeHtml(e.title)+'</b><br><span class="p-meta">'+meta+'</span>'+(e.description?'<br><span class="p-meta">'+escapeHtml(e.description)+'</span>':'')+'</span></div>';
  });
  html+='</div>';
 });
 document.getElementById('printArea').innerHTML=html;
 window.print();
}function carregarJsPDF(){return new Promise((ok,erro)=>{if(window.jspdf){ok();return}const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';s.onload=()=>ok();s.onerror=()=>erro();document.head.appendChild(s)})}
async function printPDF(){
 const arr=filtered();
 if(!arr.length){toast('Nenhum evento para exportar.');return}
 toast('Gerando PDF...');
 try{await carregarJsPDF()}catch(e){toast('Sem internet - abrindo impressao');imprimirPDF();return}
 const {jsPDF}=window.jspdf;
 const doc=new jsPDF({unit:'mm',format:'a4'});
 const M=15,FIM=278;let y=0;
 function cabecalho(){doc.setFillColor(11,79,108);doc.rect(0,0,210,20,'F');doc.setTextColor(11,79,108);;doc.setFont('helvetica','bold');doc.setFontSize(14);doc.text('Agenda anual IEADESGA',M,13);doc.setTextColor(0,0,0);y=30}
 cabecalho();
 const cat=document.getElementById('categoryFilter').value,loc=document.getElementById('locationFilter').value,esc=document.getElementById('scopeFilter').value,q=document.getElementById('search').value.trim();
 const f=[cat,esc,loc,q?'"'+q+'"':''].filter(Boolean).join(' · ');
 doc.setFont('helvetica','normal');doc.setFontSize(8);doc.setTextColor(110);
 doc.text(arr.length+' evento(s)'+(f?'  |  Filtros: '+f:'')+'  |  Gerado em '+new Date().toLocaleDateString('pt-BR'),M,y);
 y+=8;
 const grupos={};arr.forEach(e=>{(grupos[e.date]=grupos[e.date]||[]).push(e)});
 Object.keys(grupos).sort().forEach(dia=>{
  if(y>FIM-20){doc.addPage();cabecalho()}
  const d=new Date(dia+'T12:00');
  let nome=d.toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long',year:'numeric'});
  nome=nome.charAt(0).toUpperCase()+nome.slice(1);
  doc.setFillColor(240,244,243);doc.rect(M,y-4,180,7,'F');
  doc.setFont('helvetica','bold');doc.setFontSize(10);doc.setTextColor(11,79,108);
  doc.text(nome,M+2,y+1);y+=10;
  grupos[dia].forEach(e=>{
   if(y>FIM){doc.addPage();cabecalho()}
   doc.setTextColor(0);doc.setFont('helvetica','bold');doc.setFontSize(9.5);
   doc.text(e.time,M+2,y);
   const t=doc.splitTextToSize(e.title,140);doc.text(t,M+18,y);y+=t.length*4.5;
   const meta=[e.scope||'Setor',e.category,e.location,e.responsible?'Resp.: '+e.responsible:''].filter(Boolean).join(' · ');
   doc.setFont('helvetica','normal');doc.setFontSize(8);doc.setTextColor(110);
   const m=doc.splitTextToSize(meta,140);doc.text(m,M+18,y);y+=m.length*3.8;
   if(e.description){const ds=doc.splitTextToSize(e.description,140);doc.text(ds,M+18,y);y+=ds.length*3.8}
   y+=3;doc.setDrawColor(229);doc.line(M+2,y-1.5,195,y-1.5);
  });
  y+=4;
 });
 doc.save('Agenda-IEADESGA-'+new Date().toISOString().slice(0,10)+'.pdf');
 toast('PDF salvo na pasta Downloads!');
}
function printPDF(){
 const arr=filtered();
 if(!arr.length){toast('Nenhum evento para exportar.');return}
 toast('Gerando PDF...');
 if(window.jspdf){gerarPDF();return}
 const s=document.createElement('script');
 s.src='https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';
 s.onload=function(){gerarPDF()};
 s.onerror=function(){toast('Sem internet - abrindo impressao');if(typeof imprimirPDF==='function')imprimirPDF();else window.print()};
 document.head.appendChild(s);
}
function gerarPDF(){
 const arr=filtered();
 const {jsPDF}=window.jspdf;
 const doc=new jsPDF({unit:'mm',format:'a4'});
 const M=15,FIM=278;let y=0;
 function cab(){
 doc.setFillColor(255,255,255);doc.rect(0,0,210,24,'F');doc.setDrawColor(11,79,108);doc.setLineWidth(0.8);doc.line(M,24,195,24);doc.setLineWidth(0.2);
 try{
  const img=document.querySelector('.brand img');
  if(img&&img.src){
   const p=doc.getImageProperties(img.src);
   const h=15,w=h*(p.width/p.height);
   doc.addImage(img.src,'PNG',195-w,3.5,w,h);
  }
 }catch(err){}
 doc.setTextColor(11,79,108);doc.setFont('helvetica','bold');doc.setFontSize(14);
 doc.text('Agenda anual IEADESGA',M,14);
 doc.setTextColor(0,0,0);y=32;
}
 cab();
 const cat=document.getElementById('categoryFilter').value,loc=document.getElementById('locationFilter').value,esc=document.getElementById('scopeFilter').value,q=document.getElementById('search').value.trim();
 const f=[cat,esc,loc,q?'"'+q+'"':''].filter(Boolean).join(' - ');
 doc.setFont('helvetica','normal');doc.setFontSize(8);doc.setTextColor(110);
 doc.text(arr.length+' evento(s)'+(f?'  |  Filtros: '+f:'')+'  |  Gerado em '+new Date().toLocaleDateString('pt-BR'),M,y);
 y+=8;
 const g={};arr.forEach(e=>{(g[e.date]=g[e.date]||[]).push(e)});
 Object.keys(g).sort().forEach(dia=>{
  if(y>FIM-20){doc.addPage();cab()}
  const d=new Date(dia+'T12:00');
  let nome=d.toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long',year:'numeric'});
  nome=nome.charAt(0).toUpperCase()+nome.slice(1);
  doc.setFillColor(240,244,243);doc.rect(M,y-4,180,7,'F');
  doc.setFont('helvetica','bold');doc.setFontSize(10);doc.setTextColor(11,79,108);
  doc.text(nome,M+2,y+1);y+=10;
  g[dia].forEach(e=>{
   if(y>FIM){doc.addPage();cab()}
   doc.setTextColor(0);doc.setFont('helvetica','bold');doc.setFontSize(9.5);
   doc.text(e.time,M+2,y);
   const t=doc.splitTextToSize(e.title,140);doc.text(t,M+18,y);y+=t.length*4.5;
   const meta=[e.scope||'Setor',e.category,e.location,e.responsible?'Resp.: '+e.responsible:''].filter(Boolean).join(' - ');
   doc.setFont('helvetica','normal');doc.setFontSize(8);doc.setTextColor(110);
   const m=doc.splitTextToSize(meta,140);doc.text(m,M+18,y);y+=m.length*3.8;
   if(e.description){const ds=doc.splitTextToSize(e.description,140);doc.text(ds,M+18,y);y+=ds.length*3.8}
   y+=3;doc.setDrawColor(229);doc.line(M+2,y-1.5,195,y-1.5);
  });
  y+=4;
 });
 doc.save('Agenda-IEADESGA-'+new Date().toISOString().slice(0,10)+'.pdf');
 toast('PDF salvo na pasta Downloads!');
}
function logoPDF(){
 try{
  const img=document.querySelector('.brand img');
  if(!img||!img.naturalWidth)return null;
  const c=document.createElement('canvas');
  c.width=img.naturalWidth;c.height=img.naturalHeight;
  const ctx=c.getContext('2d');
  ctx.fillStyle='#ffffff';
  ctx.fillRect(0,0,c.width,c.height);
  ctx.drawImage(img,0,0);
  return {data:c.toDataURL('image/jpeg',0.92),w:c.width,h:c.height};
 }catch(e){console.log('Erro na logo:',e);return null}
}
</script>
</body>
